<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · BeautyStock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(circle at 20% 10%, var(--rosa), transparent 50%), var(--fondo); }
    .acceso { width: 100%; max-width: 380px; }
    .acceso h1 { text-align: center; margin-bottom: .1em; }
    .acceso p.sub { text-align: center; margin: 0 0 1.4em; color: var(--texto-suave); }
    form { display: flex; flex-direction: column; gap: .9em; }
    .mensaje { padding: .6em .8em; border-radius: 10px; font-size: .9rem; }
    .mensaje.error { background: var(--peligro-fondo); color: var(--peligro); }
    .mensaje.ok { background: var(--exito-fondo); color: var(--exito); }
  </style>
</head>
<body>
  <main class="acceso tarjeta">
    <h1 class="marca">Vivanet Colección</h1>
    <p class="sub">BeautyStock · Administración</p>
    <div id="mensaje"></div>
    <form method="post" action="/login">
      <label>Usuario <input name="username" autocomplete="username" required autofocus></label>
      <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primario" type="submit">Ingresar</button>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const caja = document.getElementById('mensaje');
    if (params.has('error')) caja.innerHTML = '<p class="mensaje error">Usuario o contraseña incorrectos.</p>';
    if (params.has('salio')) caja.innerHTML = '<p class="mensaje ok">Sesión cerrada.</p>';
    if (params.has('expiro')) caja.innerHTML = '<p class="mensaje error">Tu sesión expiró por inactividad.</p>';
  </script>
</body>
</html>

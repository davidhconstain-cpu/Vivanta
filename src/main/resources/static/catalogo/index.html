<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#C65360">
  <title>Catálogo · Vivanta Colección</title>
  <meta name="description" content="Catálogo de productos de belleza de Vivanta Colección. Haz tu pedido por WhatsApp.">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    /* Paleta y letras del diseno del catalogo (DM Sans, Playfair Display y Great Vibes). */
    :root {
      --tinte-3: #D6D4AD; --oferta: #A83D8A; --sobre-oferta: #fff; --borde-chip: #E7C9C6;
      --fondo: #FFF9F1; --texto: #2F2024; --texto-suave: #806C70; --borde: #E7C9C6; --linea: #F1DEDB;
      --rosa: #F3D8D8; --vino: #4A1726; --vino-pie: #713B49;
      --fuente: "DM Sans", Arial, sans-serif; --fuente-marca: "Playfair Display", Georgia, serif; --fuente-script: "Great Vibes", cursive;
    }
    body { padding-bottom: 110px; background: var(--fondo); }
    .oculto { position: absolute; left: -9999px; }

    /* Franja de envio gratis */
    .anuncio { min-height: 38px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 4px 10px; font-size: 12px; letter-spacing: .02em; color: #5A2933; text-align: center; }
    .anuncio .destello { color: var(--marca); font-size: 17px; }
    .anuncio strong { background: var(--marca); color: #fff; padding: 5px 10px; border-radius: 20px; font-weight: 600; white-space: nowrap; }

    /* Encabezado rosado con curva y menu lateral */
    .cabeza { background: #C65360; color: #fff; position: relative; }
    .cabeza::after { content: ""; position: absolute; left: -5%; right: -5%; height: 28px; bottom: -17px; background: var(--fondo); border-radius: 50% 50% 0 0 / 75% 75% 0 0; z-index: 3; pointer-events: none; }
    .cabeza-fila { height: 130px; max-width: 1100px; margin: auto; padding: 12px 22px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; position: relative; z-index: 2; }
    .cabeza.compacta .cabeza-fila { height: 104px; }
    .cabeza.compacta .logo-cabeza { width: min(170px, 45vw); }
    .hamburguesa { justify-self: start; width: 44px; height: 44px; min-height: 0; padding: 0; border: 0; background: none; display: flex; flex-direction: column; justify-content: center; gap: 6px; cursor: pointer; }
    .hamburguesa i { display: block; width: 29px; height: 2px; border-radius: 3px; background: #fff; }
    .logo-cabeza { display: block; width: min(220px, 52vw); max-height: 118px; height: auto; object-fit: contain; }
    .menu-sombra { position: fixed; inset: 0; background: #21151b80; z-index: 39; }
    .menu-lateral { position: fixed; inset: 0 auto 0 0; width: min(82vw, 390px); background: #fffdfb; z-index: 40; transform: translateX(-105%); transition: transform .3s ease; box-shadow: 12px 0 35px #32161d25; overflow-y: auto; visibility: hidden; }
    .menu-lateral.abierto { transform: translateX(0); visibility: visible; }
    .menu-cabeza { background: #C65360; min-height: 132px; padding: 22px 18px; display: flex; align-items: center; justify-content: center; position: relative; }
    .menu-cabeza img { width: 210px; max-width: 75%; height: auto; }
    .menu-cerrar { position: absolute; right: 10px; top: 8px; width: 44px; height: 44px; min-height: 0; padding: 0; border: 0; background: none; box-shadow: none; border-radius: 0; color: #fff; font-size: 30px; line-height: 1; cursor: pointer; }
    .menu-contenido { padding: 14px 24px 35px; }
    .menu-contenido nav { display: grid; }
    .menu-contenido nav a, .menu-contenido nav button { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 53px; padding: 0; border: 0; border-bottom: 1px solid #f6ecea; border-radius: 0; box-shadow: none; background: none; color: var(--texto); font: inherit; font-size: 16px; text-align: left; text-decoration: none; cursor: pointer; }
    .menu-contenido nav a::after, .menu-contenido nav button::after { content: "›"; font-size: 27px; font-weight: 300; }
    .menu-contenido .especial { color: var(--marca); font-weight: 700; }
    .menu-separador { height: 1px; background: var(--borde); margin: 14px 0; }

    /* Portada: frase, titulo y buscador */
    .intro { position: relative; text-align: center; padding: 26px 20px 12px; background: radial-gradient(ellipse at 50% 0%, #fff 0%, var(--fondo) 68%); overflow: hidden; }
    .intro::before, .intro::after { content: "❧"; position: absolute; top: 18px; color: #E9BFC1; opacity: .25; font-size: 95px; }
    .intro::before { left: -22px; transform: rotate(-35deg); }
    .intro::after { right: -22px; transform: scaleX(-1) rotate(-35deg); }
    .frase { position: relative; z-index: 1; margin: 0 auto 7px; font: clamp(25px, 5vw, 39px)/1.3 var(--fuente-script); color: #321c23; }
    .adorno { margin: 0 0 12px; color: var(--marca); font-size: 22px; letter-spacing: 8px; }
    .titulo-coleccion { margin: 0 0 8px; font: italic 500 clamp(34px, 7vw, 54px)/1.1 var(--fuente-marca); color: var(--vino); }
    .subtitulo-coleccion { max-width: 540px; margin: 0 auto 22px; font-size: 12px; line-height: 1.8; letter-spacing: .19em; text-transform: uppercase; color: #512b34; }
    .herramientas { max-width: 760px; margin: 0 auto; display: grid; gap: 12px; }
    .buscador { position: relative; }
    .buscador svg { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; stroke: var(--vino); }
    .herramientas input, .herramientas select { width: 100%; height: 54px; border: 1px solid #C98D96; border-radius: 30px; background: #fff9f5; color: #40262d; font: inherit; font-size: 16px; }
    .herramientas input { padding: 0 20px 0 56px; }
    .herramientas select { padding: 0 44px 0 22px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--vino) 50%), linear-gradient(135deg, var(--vino) 50%, transparent 50%); background-position: calc(100% - 23px) 24px, calc(100% - 17px) 24px; background-size: 6px 6px; background-repeat: no-repeat; }
    .herramientas select.elegida { border: 1.5px solid var(--principal); color: var(--principal); font-weight: 600; }

    /* Categorias mas buscadas */
    .seccion { max-width: 1100px; margin: auto; padding: 26px 18px 18px; }
    .titulo-seccion { margin: 0 0 20px; text-align: center; font: italic 500 clamp(22px, 4.5vw, 34px) var(--fuente-marca); color: #411d28; }
    .titulo-seccion em { color: var(--marca); }
    .tarjetas-categoria { display: grid; grid-template-columns: repeat(var(--columnas, 3), minmax(0, 1fr)); gap: 11px; max-width: min(900px, calc(var(--columnas, 3) * 300px)); margin: auto; }
    .tarjeta-categoria { min-width: 0; padding: 0; border: 1px solid #efc5c6; border-radius: 22px; overflow: hidden; background: var(--rosa); cursor: pointer; font: inherit; color: inherit; display: flex; flex-direction: column; }
    .tarjeta-categoria .arte, .tarjeta-categoria .nombre { width: 100%; }
    .tarjeta-categoria .arte { height: 126px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #f4c9cb, #fcece7); }
    .tarjeta-categoria .arte img { width: 100%; height: 100%; object-fit: cover; }
    .tarjeta-categoria .arte span { font-size: 60px; color: #7a3743; }
    .tarjeta-categoria .nombre { min-height: 65px; padding: 10px 7px; display: flex; align-items: center; justify-content: center; text-align: center; font: 500 14px/1.25 var(--fuente); color: #3b2028; background: #f9e8e5; }

    /* Carrusel de promociones */
    .carrusel { max-width: 1100px; margin: auto; padding: 18px 18px 30px; }
    .carrusel-ventana { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; border-radius: 24px; scrollbar-width: none; }
    .carrusel-ventana::-webkit-scrollbar { display: none; }
    .promo { flex: 0 0 100%; min-height: 245px; padding: 24px 23px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 12px; scroll-snap-align: start; border: 0; text-align: center; font: inherit; color: inherit; }
    .promo:nth-child(3n+1) { background: linear-gradient(115deg, #f5d99e, #fff0d5 55%, #f2d2cb); }
    .promo:nth-child(3n+2) { background: linear-gradient(115deg, #f7e4c8, #fff7e9 55%, #e7d8cb); }
    .promo:nth-child(3n) { background: linear-gradient(115deg, #e9c8d5, #fff0f1 55%, #d9b4c4); }
    .promo[data-producto] { cursor: pointer; }
    .promo-foto { display: flex; align-items: center; justify-content: center; min-height: 0; }
    .promo-foto img { max-width: 100%; max-height: 220px; object-fit: contain; filter: drop-shadow(0 12px 8px #4b202222); }
    .promo-foto span { font-size: clamp(70px, 15vw, 130px); color: #8c3e61; }
    .promo-marca { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #70404a; }
    .promo h3 { margin: 7px 0; font: italic 500 clamp(25px, 4vw, 38px)/1.05 var(--fuente-marca); color: #4a202a; }
    .promo p { margin: 0; font-size: 13px; line-height: 1.45; color: #3f3031; }
    .promo .ver { display: inline-block; margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--principal); text-decoration: underline; text-underline-offset: 3px; }
    .puntos { display: flex; justify-content: center; gap: 4px; padding-top: 8px; }
    .puntos button { width: 28px; height: 28px; min-height: 0; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .puntos button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #e4b8bb; }
    .puntos button[aria-current="true"]::before { background: var(--marca); }

    /* Productos */
    .contenedor { max-width: 1100px; margin: 0 auto; padding: 10px 16px 0; }
    .filtros { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
    .oculto { position: absolute; left: -9999px; }
    /* Buscador y marca en una linea; en el celular, uno debajo del otro. */
    .busqueda { display: flex; gap: 10px; flex-wrap: wrap; }
    .filtros input { flex: 1 1 260px; height: 48px; border-radius: 24px; padding: 0 18px; border-color: var(--borde-chip); background: var(--superficie); font-size: 15px; max-width: 560px; }
    .filtros select { flex: 0 1 260px; height: 48px; border-radius: 24px; padding: 0 40px 0 18px; border: 1px solid var(--borde-chip); background-color: var(--superficie); color: var(--texto); font: inherit; font-size: 15px; }
    .filtros select.elegida { border: 1.5px solid var(--principal); color: var(--principal); font-weight: 600; }
    @media (max-width: 520px) { .filtros input, .filtros select { flex-basis: 100%; max-width: none; } }
    /* Categorias en varias lineas para que se vean todas; si son muchas, dos lineas y "Ver todas". */
    .filtro-activo:not(:empty) { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 14px; margin: -8px 0 16px; font-size: 15px; }
    .filtro-activo button { min-height: 36px; padding: 0 14px; border: 1px solid var(--borde-chip); border-radius: 999px; background: var(--superficie); color: var(--principal); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    .chips { position: relative; display: flex; flex-wrap: wrap; gap: 8px; }
    .chips.recogidas { max-height: 96px; overflow: hidden; }
    .ver-mas { align-self: flex-start; min-height: 36px; margin-top: -6px; padding: 0 4px; border: 0; background: none; color: var(--principal); font: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .chips button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--borde-chip); background: var(--superficie); color: var(--texto); font-size: 14px; font-weight: 500; }
    .chips button[aria-pressed="true"] { border-color: var(--principal); background: var(--principal); color: var(--sobre-principal); font-weight: 600; }
    .chips .chip-oferta { border: 1.5px solid var(--oferta); font-weight: 600; padding: 0 18px; }
    .chips .chip-oferta svg { stroke: var(--oferta); }
    .chips .chip-oferta[aria-pressed="true"] { background: var(--oferta); border-color: var(--oferta); color: var(--sobre-oferta); }
    .chips .chip-oferta[aria-pressed="true"] svg { stroke: currentColor; }

    .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; align-content: start; }
    .aviso-ofertas { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--amarillo); border: 1px solid var(--beige); color: var(--texto); text-align: left; font: inherit; cursor: pointer; width: 100%; min-height: 0; }
    .aviso-ofertas .tile { flex: 0 0 40px; height: 40px; border-radius: 12px; background: var(--superficie); display: flex; align-items: center; justify-content: center; }
    .aviso-ofertas .tile svg { stroke: var(--oferta); }
    .aviso-ofertas strong { display: block; font-family: var(--fuente-marca); font-size: 22px; font-weight: 700; line-height: 1.1; }
    .aviso-ofertas .texto { font-size: 13px; color: var(--aviso); }

    .producto { background: var(--superficie); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(58, 42, 46, .06); }
    .producto .foto { position: relative; padding: 0; border: 0; border-radius: 0; min-height: 0; height: auto; aspect-ratio: 4 / 5; width: 100%; display: flex; align-items: center; justify-content: center; background: var(--rosa); cursor: pointer; }
    .producto:nth-of-type(3n+2) .foto { background: var(--amarillo); }
    .producto:nth-of-type(3n) .foto { background: var(--tinte-3); }
    /* La foto completa, sin recortar (los frascos son verticales); fondo blanco como el de las fotos. */
    .producto .foto.con-foto { background: #fff; }
    .producto .foto img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .producto .foto img.sin-foto { width: 64px; height: 64px; border-radius: 16px; opacity: .9; }
    .producto.agotado .foto img { opacity: .4; }
    .producto .foto .etiqueta { position: absolute; top: 10px; left: 10px; }
    .producto .cuerpo { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; }
    .producto .categoria-prod { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave); }
    .pastillas { display: flex; flex-wrap: wrap; gap: 6px; }
    .pastilla-set { padding: 3px 10px; border-radius: 999px; background: var(--principal); color: var(--sobre-principal); font-size: 12px; font-weight: 600; }
    .producto .incluye { margin: 0; font-size: 12px; line-height: 1.35; color: var(--texto-suave); }
    .chips .chip-set { padding: 0 18px; }
    .chips .chip-set svg { stroke: currentColor; }
    .pastilla-oferta { align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: var(--oferta); color: var(--sobre-oferta); font-size: 12px; font-weight: 600; }
    .producto h2 { margin: 0; font-family: var(--fuente); font-size: 15px; font-weight: 500; line-height: 1.25; min-height: 38px; }
    .producto .marca-prod { margin: 0; font-size: 12px; color: var(--texto-suave); }
    .producto .precio { margin: 4px 0 0; font-family: var(--fuente-marca); font-size: 24px; font-weight: 700; line-height: 1.1; }
    .producto .antes { font-family: var(--fuente); font-size: 13px; font-weight: 400; color: var(--texto-suave); }
    .producto .vigencia { margin: 0; font-size: 12px; }
    .producto.agotado h2, .producto.agotado .precio { color: var(--texto-suave); }
    .producto .acciones { margin-top: auto; padding-top: 8px; }
    .producto .acciones > button { width: 100%; min-height: 48px; border-radius: 14px; font-size: 15px; font-weight: 600; }
    .producto .acciones > .contorno { border: 1.5px solid var(--principal); background: var(--superficie); color: var(--principal); }
    .producto .acciones > button:disabled { border: 1.5px solid var(--borde-chip); background: var(--fondo); color: var(--texto-suave); opacity: 1; }
    .stepper { display: flex; align-items: center; justify-content: space-between; background: var(--rosa); border-radius: 14px; padding: 2px; }
    .stepper button { width: 44px; height: 44px; min-height: 44px; padding: 0; border: 0; border-radius: 12px; background: transparent; color: var(--texto); font-size: 22px; }
    .stepper .mas { background: var(--principal); color: var(--sobre-principal); }
    .stepper output { font-weight: 600; font-size: 16px; }

    .barra-pedido { position: fixed; left: 0; right: 0; bottom: 0; background: var(--superficie); border-top: 1px solid var(--borde); padding: 12px 16px 16px; z-index: 30; display: flex; flex-direction: column; gap: 8px; }
    .barra-pedido a { width: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; min-height: 54px; padding: 0 20px; border-radius: 16px; background: var(--principal); color: var(--sobre-principal); text-decoration: none; font-size: 16px; font-weight: 600; }
    .barra-pedido p { margin: 0; text-align: center; font-size: 12px; color: var(--texto-suave); }

    .pedido { max-width: 560px; margin: 0 auto; padding: 22px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
    .volver { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--principal); text-decoration: none; font-size: 15px; font-weight: 600; align-self: flex-start; }
    .pedido h1 { margin: 0; font-size: 36px; }
    .items { list-style: none; margin: 0; padding: 4px 16px; }
    .items li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--linea); }
    .items li:first-child { border-top: 0; }
    .items img { flex: 0 0 56px; width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--rosa); }
    .items .texto { flex: 1 1 auto; min-width: 0; }
    .items .texto strong { display: block; font-size: 15px; font-weight: 600; }
    .items .texto span { font-size: 13px; color: var(--texto-suave); }
    .items .quitar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .items .quitar button { min-height: 34px; width: 34px; padding: 0; }
    .resumen-pedido { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .resumen-pedido div { display: flex; justify-content: space-between; }
    .resumen-pedido .total { padding-top: 8px; border-top: 1px solid var(--linea); align-items: baseline; }
    .resumen-pedido .total span:last-child { font-family: var(--fuente-marca); font-size: 34px; font-weight: 700; line-height: 1; }
    .whatsapp { min-height: 54px; border-radius: 14px; font-size: 16px; }
    .nota { margin: 0; font-size: 13px; line-height: 1.45; color: var(--texto-suave); text-align: center; }
    .pedido .opciones .opcion { flex: 1 1 0; }

    /* Pie color vino con las redes en una caja blanca */
    footer { margin-top: 40px; padding: 34px 22px 20px; background: var(--vino-pie); color: #fff; text-align: center; }
    .pie-logo { font: 500 40px var(--fuente-marca); }
    .pie-frase { margin: 4px 0 0; color: #f1dadd; font: italic 17px var(--fuente-marca); }
    .pie-datos { margin: 14px 0 0; font-size: 13px; line-height: 1.7; color: #f1dadd; }
    .redes-caja { max-width: 900px; margin: 22px auto 0; padding: 32px 14px 36px; background: #fffdfb; color: #382a30; }
    .redes-caja h2 { margin: 0 0 22px; font: 500 clamp(26px, 5vw, 40px) var(--fuente-marca); color: #382a30; }
    .redes { display: grid; grid-template-columns: repeat(var(--columnas, 5), minmax(0, 1fr)); gap: 8px; max-width: 640px; margin: auto; }
    .redes a, .redes button { min-width: 0; min-height: 0; padding: 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 7px; color: #382a30; text-decoration: none; font: inherit; font-size: clamp(10px, 1.7vw, 14px); font-weight: 600; cursor: pointer; }
    .redes img { width: clamp(42px, 8vw, 64px); height: clamp(42px, 8vw, 64px); object-fit: contain; transition: transform .15s; }
    .redes a:hover img, .redes button:hover img { transform: translateY(-2px); }
    .pie-enlaces { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 22px; margin: 22px auto; }
    .pie-enlaces a, .pie-enlaces button { min-height: 0; padding: 0; border: 0; background: none; color: #fff0f0; font: inherit; font-size: 13px; text-decoration: none; cursor: pointer; }
    .pie-enlaces a:hover, .pie-enlaces button:hover { text-decoration: underline; }
    .derechos { font-size: 11px; color: #e4c5ca; }

    .mantenimiento { max-width: 520px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    /* Detalle del producto: foto a la izquierda, datos y lo que incluye el set a la derecha. */
    .modal.detalle-producto { position: relative; max-width: 960px; padding: 28px; }
    .cerrar-detalle { position: absolute; top: 12px; right: 12px; z-index: 2; }
    .detalle-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
    .foto-grande { position: relative; aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden; background: var(--rosa); display: flex; align-items: center; justify-content: center; }
    .foto-grande.con-foto { background: #fff; border: 1px solid var(--linea); }
    .foto-grande img { width: 100%; height: 100%; object-fit: contain; }

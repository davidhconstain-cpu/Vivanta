<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · Vivanta Colección</title>
  <meta name="description" content="Catálogo de productos de belleza de Vivanta Colección. Haz tu pedido por WhatsApp.">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    body { padding-bottom: 96px; }
    .cabeza { background: var(--superficie); border-bottom: 1px solid var(--borde); padding: 10px 16px; display: flex; justify-content: center; position: sticky; top: 0; z-index: 20; }
    .cabeza .logo { width: 132px; }
    .contenedor { max-width: 1100px; margin: 0 auto; padding: 14px 16px 0; }
    .filtros { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
    .filtros input { height: 46px; border-radius: 23px; max-width: 520px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .chips button { flex: 0 0 auto; border-radius: 999px; font-weight: 500; font-size: 14px; }
    .chips button[aria-pressed="true"] { border: 1.5px solid var(--principal); background: var(--rosa); font-weight: 600; }
    .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .producto { background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px; padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .producto .foto { position: relative; padding: 0; border: 0; min-height: 0; border-radius: 10px; overflow: hidden; background: var(--rosa); display: block; width: 100%; }
    .producto .foto img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
    .producto .foto .etiqueta { position: absolute; top: 8px; left: 8px; }
    .producto.agotado .foto img { opacity: .45; }
    .producto h2 { margin: 4px 4px 0; font-family: var(--fuente); font-size: 14px; font-weight: 500; line-height: 1.25; }
    .producto .marca-prod { margin: 0 4px; font-size: 12px; color: var(--texto-suave); }
    .producto .precio { margin: 0 4px; font-size: 16px; font-weight: 600; }
    .producto.agotado .precio { color: var(--texto-suave); }
    .precio.oferta { color: var(--principal); }
    .antes { color: var(--texto-suave); font-size: .8em; font-weight: 400; }
    .vigencia { margin: 0 4px; font-size: 12px; color: var(--principal); }
    .etiqueta.oferta { background: var(--principal); color: var(--sobre-principal); border-color: var(--principal); }
    .chips .chip-oferta { color: var(--principal); }
    .producto .acciones { margin-top: auto; padding-top: 2px; }
    .producto .acciones > button { width: 100%; }
    .stepper { display: flex; align-items: center; justify-content: space-between; }
    .stepper button { width: 44px; padding: 0; font-size: 20px; font-weight: 500; }
    .stepper .mas { background: var(--principal); border-color: var(--principal); color: var(--sobre-principal); }
    .stepper output { font-weight: 600; }

    .barra-pedido { position: fixed; left: 0; right: 0; bottom: 0; background: var(--superficie); border-top: 1px solid var(--borde); padding: 12px 16px 16px; z-index: 30; }
    .barra-pedido a { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 20px; border-radius: 14px; background: var(--principal); color: var(--sobre-principal); text-decoration: none; font-size: 16px; font-weight: 600; }

    .pedido { max-width: 560px; margin: 0 auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
    .volver { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--principal); text-decoration: none; font-size: 15px; font-weight: 600; align-self: flex-start; }
    .pedido h1 { margin: 0; font-size: 36px; }
    .items { list-style: none; margin: 0; padding: 4px 16px; }
    .items li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--linea); }
    .items li:first-child { border-top: 0; }
    .items img { flex: 0 0 56px; width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--rosa); }
    .items .texto { flex: 1 1 auto; min-width: 0; }
    .items .texto strong { display: block; font-size: 15px; font-weight: 600; }
    .items .texto span { font-size: 13px; color: var(--texto-suave); }
    .items .quitar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .items .quitar button { min-height: 34px; width: 34px; padding: 0; }
    .resumen-pedido { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .resumen-pedido div { display: flex; justify-content: space-between; }
    .resumen-pedido .total { padding-top: 8px; border-top: 1px solid var(--linea); align-items: baseline; }
    .resumen-pedido .total span:last-child { font-family: var(--fuente-marca); font-size: 34px; font-weight: 700; line-height: 1; }
    .whatsapp { min-height: 54px; border-radius: 14px; font-size: 16px; }
    .nota { margin: 0; font-size: 13px; line-height: 1.45; color: var(--texto-suave); text-align: center; }
    .pedido .opciones .opcion { flex: 1 1 0; }

    footer { margin-top: 40px; padding: 28px 16px; background: var(--superficie); border-top: 1px solid var(--borde); text-align: center; color: var(--texto-suave); display: flex; flex-direction: column; align-items: center; gap: 6px; }
    footer .logo { width: 140px; margin-bottom: 6px; }
    footer p { margin: 0; }
    footer .redes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .mantenimiento { max-width: 520px; margin: 3em auto; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .detalle-fotos { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; }
    .detalle-fotos img { width: 100%; max-height: 60vh; object-fit: contain; flex: 0 0 100%; scroll-snap-align: start; border-radius: 12px; background: var(--rosa); }
    @media (min-width: 700px) { .producto h2 { font-size: 15px; } }
    /* En el celular, dos productos por fila (como el diseno). */
    @media (max-width: 520px) { .grilla { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <header class="cabeza"><a href="#" id="inicio"><img class="logo" src="/img/logo-vivanta.png" alt="Vivanta Colección" width="132" height="55"></a></header>
  <main id="principal"><p class="suave contenedor">Cargando catálogo…</p></main>
  <footer id="pie"></footer>
  <div class="barra-pedido" id="barra-pedido" hidden><a href="#pedido"><span id="barra-cuenta">Ver pedido</span><span id="barra-total">$0</span></a></div>
  <div id="avisos" aria-live="polite"></div>
  <script src="/catalogo/catalogo.js"></script>
</body>
</html>

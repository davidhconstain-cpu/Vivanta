<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#C65360">
  <title>Catálogo · Vivanta Colección</title>
  <meta name="description" content="Catálogo de productos de belleza de Vivanta Colección. Haz tu pedido por WhatsApp.">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/catalogo/catalogo.css">
</head>
<body>
  <div class="announcement" id="anuncio" hidden></div>
  <header class="header" id="cabeza">
    <svg class="tagline-arc" viewBox="0 0 620 170" role="img" aria-label="Un universo de belleza por descubrir.">
      <path id="arcoFrase" d="M 15 165 Q 310 5 605 165" fill="none"/>
      <text><textPath href="#arcoFrase" startOffset="50%" text-anchor="middle">Un universo de belleza por descubrir.</textPath></text>
    </svg>
    <div class="header-row">
      <button type="button" class="menu-toggle" id="abrir-menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu"><span class="hamb"><i></i><i></i><i></i></span></button>
      <a href="#" id="inicio" aria-label="Inicio del catálogo"><img class="logo" src="/img/logo-blanco.png" alt="Vivanta Colección" width="600" height="334"></a>
      <span></span>
    </div>
  </header>
  <div class="search-bar" id="buscador">
    <div class="search-wrap"><input id="buscar" type="search" placeholder="Busca un producto o una marca..." aria-label="Buscar productos o marcas" autocomplete="off"></div>
    <nav class="brand-filter" id="marcas" aria-label="Filtrar por marca"></nav>
  </div>
  <div class="drawer-shade" id="menu-sombra" hidden></div>
  <aside class="drawer" id="menu" aria-label="Menú de navegación">
    <div class="drawer-head"><img id="menu-logo" src="/img/banner-vivanta.jpg" alt="Vivanta Colección"><button type="button" class="drawer-close" id="cerrar-menu" aria-label="Cerrar menú">×</button></div>
    <div class="drawer-content" id="menu-contenido"></div>
  </aside>
  <div class="filtros-sombra" id="filtros-sombra" hidden></div>
  <aside class="filtros-panel" id="filtros" role="dialog" aria-modal="true" aria-labelledby="filtros-titulo"></aside>
  <main id="principal"><p class="no-results">Cargando catálogo…</p></main>
  <footer class="footer" id="pie"></footer>
  <div class="barra-pedido" id="barra-pedido" hidden>
    <a href="#pedido"><span id="barra-cuenta">Ver pedido</span><span id="barra-total">$0</span></a>
    <p id="barra-nota"></p>
  </div>
  <div class="wa-float" id="waFloat" hidden>
    <div class="wa-bubble">¡Escríbeme si necesitas ayuda!</div>
    <button type="button" class="wa-btn" aria-label="Escríbenos por WhatsApp"><img src="/img/redes/whatsapp.png" alt=""></button>
  </div>
  <div id="avisos" aria-live="polite"></div>
  <script src="/catalogo/catalogo.js"></script>
</body>
</html>

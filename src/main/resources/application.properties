spring.application.name=beautystock

# Las contrasenas NO van en este archivo (se sube a GitHub).
# En el PC se leen de local.properties (ignorado por Git, ver local.properties.example);
# en la nube, de variables de entorno con los mismos nombres.
spring.config.import=optional:file:./local.properties

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/beautystock}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
# La conexion a la base de datos se suelta apenas el servicio termina (no mientras se envia la respuesta).
# Los servicios ya devuelven DTOs armados dentro de su transaccion.
spring.jpa.open-in-view=false

# Usuario administrador
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD}

# La sesion se cierra tras 30 minutos de inactividad
server.servlet.session.timeout=30m

# Las sesiones se guardan en la base de datos (tablas SPRING_SESSION), asi no se pierden
# cuando la app se reinicia, se actualiza o "despierta" en el plan gratis de Render.
spring.session.jdbc.initialize-schema=always
server.servlet.session.cookie.same-site=lax

# Imagenes de productos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

server.port=${PORT:8080}

# En la nube la app esta detras de un proxy con HTTPS: respetar sus encabezados
server.forward-headers-strategy=framework

# Pocas conexiones a la base de datos (suficiente para un negocio y amable con el plan gratis)
spring.datasource.hikari.maximum-pool-size=5

# Si un numero llega vacio desde el navegador, se toma como 0
spring.jackson.deserialization.fail-on-null-for-primitives=false
